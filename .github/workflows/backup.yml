name: Database backup

# Weekly mongodump of the bdgtr database (docs/PLAN.md §10, docs/BACKUPS.md).
# The repo is public, so the dump is encrypted with the owner's age PUBLIC key
# (.github/backup-age-recipient.txt) before it's uploaded; only the owner's
# private key, which never leaves their computer, can open it.
on:
  schedule:
    - cron: '0 19 * * 6' # Sundays 03:00 Manila
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/backup-age-recipient.txt
          sparse-checkout-cone-mode: false

      - name: Check setup
        env:
          BACKUP_MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
        run: |
          if [ -z "$BACKUP_MONGODB_URI" ]; then echo "::error::Add the BACKUP_MONGODB_URI secret (docs/BACKUPS.md)"; exit 1; fi
          if ! grep -qE '^age1[0-9a-z]{58}$' .github/backup-age-recipient.txt; then
            echo "::error::.github/backup-age-recipient.txt must hold one age public key (age1…)"; exit 1
          fi

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump (mongodump in the official MongoDB image)
        env:
          BACKUP_MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
        run: |
          umask 077
          mkdir -p out
          # The URI goes in through the environment, never on a command line or in the log.
          docker run --rm -e BACKUP_MONGODB_URI -v "$PWD/out:/out" mongo:8 \
            sh -c 'mongodump --uri "$BACKUP_MONGODB_URI" --db bdgtr --gzip --archive=/out/bdgtr.archive.gz --quiet'
          test -s out/bdgtr.archive.gz

      - name: Encrypt, then delete the plain copy
        run: |
          stamp=$(TZ=Asia/Manila date +%Y-%m-%d)
          age -R .github/backup-age-recipient.txt -o "out/bdgtr-$stamp.archive.gz.age" out/bdgtr.archive.gz
          sudo shred -u out/bdgtr.archive.gz
          ls -l out
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bdgtr-backup-${{ env.STAMP }}
          path: out/*.age
          retention-days: 90
          if-no-files-found: error
