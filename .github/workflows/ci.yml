name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); the comment shows the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: API loads the way Vercel runs it
        run: pnpm --filter @bdgtr/api verify:deploy

      - name: Build web
        env:
          EXPO_PUBLIC_API_URL: https://bdgtr-api.erroldee.com
          # Production Clerk publishable key (public), so CI checks the same CSP as the live site.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuYmRndHIuZXJyb2xkZWUuY29tJA
        # Start without packages/shared/dist, like Cloudflare Pages' fresh checkout
        # (earlier test steps build it, which once hid a missing build step).
        run: rm -rf packages/shared/dist && pnpm build:web

      - name: Accessibility checks (axe, WCAG 2.2 AA) on the built website
        run: |
          pnpm --filter @bdgtr/mobile exec playwright install --with-deps chromium
          pnpm --filter @bdgtr/mobile test:a11y

      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanner (the action otherwise picks its own, older version).
          # Keep in step with the version used to test .gitleaks.toml locally.
          GITLEAKS_VERSION: 8.30.1
